<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>小學勇者大冒險 2.0</title>
  <link rel="stylesheet" href="./css/app.css">
  <link rel="stylesheet" href="./css/gm.css">
</head>
<body>
  <main class="app-shell" id="appShell">
    <header class="app-header">
      <h1>⚔️ 小學勇者大冒險 <span class="version-tag">2.0 CORE</span></h1>
      <div class="profile-bar">
        <button id="profileButton" class="profile-switch">切換勇者</button>
        <div id="activeProfileLabel" class="active-profile"></div>
      </div>
    </header>

    <nav id="mainNav" class="main-nav" aria-label="主要功能">
      <button data-view="status" class="nav-button active">狀態</button>
      <button data-view="tasks" class="nav-button">任務</button>
      <button data-view="dungeon" class="nav-button">副本</button>
      <button data-view="shop" class="nav-button">商店</button>
      <button data-view="lottery" class="nav-button">抽獎</button>
      <button data-view="bag" class="nav-button">背包</button>
      <button data-view="social" class="nav-button">好友</button>
      <button data-view="gm" class="nav-button">家長後台</button>
    </nav>

    <section id="viewRoot" class="view-root" aria-live="polite"></section>
  </main>

  <div id="modalRoot"></div>
  <script type="module" src="./js/core/app.js"></script>
</body>
</html>
